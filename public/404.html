<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>decap-cms-demo</title>
    <script>
      // GitHub Pages SPA redirect
      // This script takes the current url and converts the path and query
      // string into a hash that will be read by index.html
      sessionStorage.redirect = location.href
      location.replace(
        location.pathname.split('/').slice(0, 2).join('/') + '/index.html',
      )
    </script>
  </head>
  <body></body>
</html>
