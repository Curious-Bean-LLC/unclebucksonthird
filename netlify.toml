[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { NOT = { Path = ["/admin/*", "*.yml", "*.yaml", "*.json", "*.xml", "*.txt"] } }

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/admin/config.yml"
  [headers.values]
    Content-Type = "application/x-yaml; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
